# Base infrastructure for WebDock Dev.
# Normally started through the portal ("Start infrastructuur") which sets LDP_DATA_DIR / LDP_SITES_DIR.
# Manual: docker compose -p local-dev-portal -f docker/docker-compose.yml up -d

name: local-dev-portal

x-php: &php
  restart: unless-stopped
  networks: [ldp]
  volumes:
    - ${LDP_SITES_DIR:-../data/sites}:/var/www
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  proxy:
    image: nginx:stable-alpine
    container_name: ldp-proxy
    restart: unless-stopped
    ports:
      # Loopback only by default; set LDP_BIND=0.0.0.0 to reach sites from other devices.
      - "${LDP_BIND:-127.0.0.1}:80:80"
      - "${LDP_BIND:-127.0.0.1}:443:443"
    volumes:
      # vhost files generated by the portal (one per project)
      - ${LDP_DATA_DIR:-../data}/nginx/conf.d:/etc/nginx/conf.d:ro
      # certificates generated by mkcert / rcgen
      - ${LDP_DATA_DIR:-../data}/certs:/etc/nginx/certs:ro
      - ${LDP_SITES_DIR:-../data/sites}:/var/www
    networks: [ldp]

  php81:
    <<: *php
    container_name: ldp-php81
    build: { context: ./php, args: { PHP_VERSION: "8.1" } }
    image: ldp-php:8.1
  php82:
    <<: *php
    container_name: ldp-php82
    build: { context: ./php, args: { PHP_VERSION: "8.2" } }
    image: ldp-php:8.2
  php83:
    <<: *php
    container_name: ldp-php83
    build: { context: ./php, args: { PHP_VERSION: "8.3" } }
    image: ldp-php:8.3
  php84:
    <<: *php
    container_name: ldp-php84
    build: { context: ./php, args: { PHP_VERSION: "8.4" } }
    image: ldp-php:8.4
  php85:
    <<: *php
    container_name: ldp-php85
    build: { context: ./php, args: { PHP_VERSION: "8.5" } }
    image: ldp-php:8.5

  mariadb:
    image: mariadb:11
    container_name: ldp-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${LDP_DB_ROOT_PASSWORD:-root}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ldp-db:/var/lib/mysql
    networks: [ldp]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5
    container_name: ldp-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: ldp-mariadb
      # Auto-login as root: phpMyAdmin is only reachable from this PC (127.0.0.1).
      PMA_USER: root
      PMA_PASSWORD: ${LDP_DB_ROOT_PASSWORD:-root}
      UPLOAD_LIMIT: 256M
    ports:
      - "127.0.0.1:8080:80"
    depends_on: [mariadb]
    networks: [ldp]

networks:
  ldp:
    name: ldp-net

volumes:
  ldp-db:
