[package]
name = "webdock-dev"
version = "0.1.0"
edition = "2021"
description = "WebDock Dev: lightweight local PHP development portal (Docker, hosts-file, SSL) in a single binary"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "net", "signal", "sync", "io-util"] }
bollard = "0.18"
futures-util = "0.3"
rust-embed = "8"
mime_guess = "2"
rcgen = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
ureq = { version = "2", features = ["json"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
tao = "0.30"
winreg = "0.52"

[build-dependencies]
embed-resource = "2"

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1
